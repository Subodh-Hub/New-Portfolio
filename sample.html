<script>
        (function() {
            // --- 1. Mouse Trail Logic ---
            const cursorMain = document.getElementById('cursor-main');
            const maxDots = 8;
            let dots = [];

            function updateCursor(e) {
                const { clientX: x, clientY: y } = e;
                cursorMain.style.left = `${x}px`;
                cursorMain.style.top = `${y}px`;

                if (Math.random() > 0.4) {
                    const dot = document.createElement('div');
                    dot.className = 'trail-dot';
                    dot.style.left = `${x}px`;
                    dot.style.top = `${y}px`;
                    document.body.appendChild(dot);
                    dots.push(dot);

                    requestAnimationFrame(() => {
                        dot.style.opacity = '0';
                        dot.style.transform = 'translate(-50%, -50%) scale(0.1)';
                    });

                    if (dots.length > maxDots) {
                        const oldest = dots.shift();
                        setTimeout(() => oldest.remove(), 400);
                    }
                }
            }
            document.addEventListener('mousemove', updateCursor);

            const interactives = document.querySelectorAll('button, a');
            interactives.forEach(el => {
                el.addEventListener('mouseenter', () => {
                    cursorMain.style.width = '32px';
                    cursorMain.style.height = '32px';
                    cursorMain.style.backgroundColor = 'rgba(26, 26, 26, 0.05)';
                    cursorMain.style.border = '1px solid rgba(26, 26, 26, 0.2)';
                });
                el.addEventListener('mouseleave', () => {
                    cursorMain.style.width = '8px';
                    cursorMain.style.height = '8px';
                    cursorMain.style.backgroundColor = '#1a1a1a';
                    cursorMain.style.border = 'none';
                });
            });

            // --- 2. Bubble Physics Reveal Logic ---
            const canvas = document.getElementById('mask-canvas');
            const ctx = canvas.getContext('2d');
            const trigger = document.getElementById('portrait-bubble-trigger');
            const revealLayer = document.getElementById('color-reveal-layer');
            
            let bubbles = [];
            const MAX_BUBBLES = 40;
            
            function resizeCanvas() {
                const rect = trigger.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
            }
            
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Bubble {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.radius = 5;
                    this.maxRadius = Math.random() * 40 + 60;
                    this.growthRate = Math.random() * 2 + 3;
                    this.opacity = 1;
                    this.decay = 0.015 + Math.random() * 0.01;
                    this.vx = (Math.random() - 0.5) * 1.5;
                    this.vy = (Math.random() - 0.5) * 1.5;
                }

                update() {
                    if (this.radius < this.maxRadius) {
                        this.radius += this.growthRate;
                    }
                    this.x += this.vx;
                    this.y += this.vy;
                    this.opacity -= this.decay;
                }

                draw(context) {
                    context.beginPath();
                    context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    context.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                    context.fill();
                }
            }

            function handleMouseMove(e) {
                const rect = trigger.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Add bubble if moving mouse
                if (bubbles.length < MAX_BUBBLES) {
                    bubbles.push(new Bubble(x, y));
                }
            }

            trigger.addEventListener('mousemove', handleMouseMove);

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Keep some persistence of mask
                ctx.fillStyle = 'rgba(0,0,0,0)'; 
                ctx.fillRect(0,0, canvas.width, canvas.height);

                for (let i = bubbles.length - 1; i >= 0; i--) {
                    bubbles[i].update();
                    bubbles[i].draw(ctx);
                    if (bubbles[i].opacity <= 0) {
                        bubbles.splice(i, 1);
                    }
                }

                // Apply mask to the color reveal layer
                if (bubbles.length > 0) {
                    const maskData = canvas.toDataURL();
                    revealLayer.style.webkitMaskImage = `url(${maskData})`;
                    revealLayer.style.maskImage = `url(${maskData})`;
                    revealLayer.style.webkitMaskRepeat = 'no-repeat';
                    revealLayer.style.maskRepeat = 'no-repeat';
                    revealLayer.style.webkitMaskSize = '100% 100%';
                    revealLayer.style.maskSize = '100% 100%';
                } else {
                    revealLayer.style.webkitMaskImage = 'none';
                    revealLayer.style.maskImage = 'none';
                }

                requestAnimationFrame(animate);
            }

            // Start animation loop
            animate();
        })();
    </script>
